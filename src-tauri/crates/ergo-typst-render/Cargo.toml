[package]
name = "ergo-typst-render"
version = "0.1.0"
edition = "2024"
description = "Vendored typst-render 0.15.1 plus a visible-band render_region for Ergo's canvas preview."
license = "Apache-2.0"
publish = false

[lib]
name = "ergo_typst_render"
path = "src/lib.rs"

# Mirrors typst-render 0.15.1's dependency set. The crate is vendored verbatim
# (see the upstream crate for the original sources) so the private frame-walking
# internals (`State`, `render_frame`) can back the added `render_region`.
[dependencies]
bytemuck = "1"
comemo = "0.5.1"
hayro = { version = "0.7.1", default-features = false }
image = { version = "0.25.5", features = ["png", "jpeg", "gif", "webp"], default-features = false }
libm = "0.2.11"
pixglyph = "0.6.1"
resvg = { version = "0.47", features = ["raster-images"], default-features = false }
tiny-skia = "0.12"
ttf-parser = "0.25.0"
typst-assets = "0.15.1"
typst-layout = "0.15.1"
typst-library = "0.15.1"
typst-macros = "0.15.1"
typst-timing = "0.15.1"
typst-utils = "0.15.1"
