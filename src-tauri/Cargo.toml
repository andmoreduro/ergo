[package]
name = "ergo"
version = "0.1.0"
description = "Érgo desktop app"
authors = ["you"]
edition = "2021"

default-run = "ergo"

[workspace]
resolver = "2"
members = [
    "crates/ergo-core",
    "crates/ergo-engine-wasm",
    "crates/ergo-typst-render",
]

[lib]
name = "ergo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
uuid = { version = "1.23.1", features = ["v4", "js"] }
chrono = "0.4.44"
parking_lot = "0.12.5"
# Deflate only (matches ergo-core): keeps zstd's C build out of the Windows build.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Platform TLS (Schannel on Windows, OpenSSL on Linux): no CMake/NASM-built
# crypto in the dependency tree, which the Windows CI runner cannot provide.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "charset", "http2", "system-proxy"] }
flate2 = "1"
tar = "0.4"
ergo-core = { path = "crates/ergo-core" }
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-ide = "0.15.1"
include_dir = "0.7.4"
